<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tempo Favorites Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Tempo › Location › Music › Favorites. Controls follow "Material UI - for TouchTunes (v5.11.1)" (Figma 9pen9UeYBpPFVPwKrGDCcU), Tempo = Color=Secondary #2270a8; page layout from DS 2.0 (Route list). Light-only, like the product. */
:root{
  color-scheme: light;
  --primary:#2270a8; --primary-border:rgba(34,112,168,.5); --primary-tint:rgba(34,112,168,.08); --primary-tint-2:rgba(34,112,168,.14);
  --text:rgba(25,25,25,.87); --text-2:rgba(25,25,25,.6); --text-3:rgba(25,25,25,.38);
  --action:rgba(0,0,0,.56); --input-border:rgba(0,0,0,.42); --divider:rgba(0,0,0,.1); --hover:rgba(0,0,0,.04);
  --surface:#ffffff; --page:#f5f5f5; --box:#f8f8f8; --host:#2c2c2c;
  --success:#4cad92; --success-ink:#1a6651; --success-tint:#edf7ed;
  --error:#ff1744; --error-ink:#5f2120; --error-tint:#fdeded;
  --warn-ink:#663c00; --warn-tint:#fff4e5; --warn-icon:#fd744c; --warning:#fd744c; --moderate:#fd744c; --primary-dark:#1a6093; --error-dark:#f01741; --chip-fill:#f5f5f5;
  --info-ink:#491979; --info-tint:#f7e4ff;
  --snack:#292929; --snack-action:#8fc1e6;
  --note:#fff2a0; --note-ink:#463b00; --note-line:#dcc650;
  --proto:#1b1d21; --proto-2:#34383f; --proto-ink:#eef0f3; --proto-ink-2:#a9b0ba;
  --font:"Proxima Nova","proxima-nova","Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--host);color:var(--text);font-family:var(--font);font-size:14px;line-height:20px;letter-spacing:.17px;-webkit-font-smoothing:antialiased;padding-block:0 24px}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #191919;outline-offset:2px}
p{margin:0}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
.ico{width:20px;height:20px;flex:none;fill:currentColor}

/* ---------- prototype bar (not part of the design) ---------- */
.proto{background:var(--proto);color:var(--proto-ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:0;margin-bottom:24px}
body.test{padding-top:24px}
.proto h1{font-size:14px;font-weight:700;margin:0}
.proto h1 span{font-weight:400;color:var(--proto-ink-2)}
.pgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pgroup>label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--proto-ink-2)}
.seg{display:inline-flex;background:var(--proto-2);border-radius:6px;padding:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--proto-ink-2);padding:4px 9px;border-radius:4px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--proto-ink);color:var(--proto)}
.pbtn{border:1px solid var(--proto-2);background:none;color:var(--proto-ink);padding:4px 10px;border-radius:6px;font-size:12.5px}
.pbtn:hover{background:var(--proto-2)}
.pspacer{flex:1}
.frame-wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Tempo page frame (from bgm-schedule-v3) ---------- */
.frame{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:64px minmax(0,1fr);border-radius:12px;overflow:clip;background:var(--page);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.sidenav{background:linear-gradient(#16a0b6,#2d3e99);padding:8px 2px}
.sidenav svg{width:60px;height:413px}
.content{min-width:0;display:flex;flex-direction:column}
.page-head{background:var(--surface);padding:8px 16px 0}
.head-row{display:flex;align-items:flex-start;gap:16px;padding-top:8px;flex-wrap:wrap}
.title-wrap{flex:1;min-width:0}
.device{display:flex;align-items:center;gap:12px}
.device-id{display:inline-flex;align-items:center;gap:4px;margin:0;font-size:34px;line-height:1.235;font-weight:400;letter-spacing:.25px}
.device-id svg{width:24px;height:24px}
.crumbs{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:14px;line-height:20px;color:var(--text-2);flex-wrap:wrap}
.crumbs a{color:var(--primary);font-weight:600;text-decoration:none}
.crumbs .dot{width:3px;height:3px;border-radius:50%;background:var(--text-2)}
.page-head .tag{padding:1px 6px;border-radius:4px;background:rgba(0,0,0,.06);font-size:13px;line-height:18px;color:var(--text)}
.head-actions{display:flex;align-items:center;gap:16px;padding-top:4px}
.status{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--success);border-radius:100px;background:none;color:var(--success);font-size:14px;font-weight:600;letter-spacing:.4px}
.status svg{width:20px;height:20px}
.icon-btn{position:relative;width:32px;height:32px;padding:4px;display:grid;place-items:center;border:0;border-radius:100px;background:none;color:var(--action)}
@media (hover:hover){.icon-btn:hover{background:var(--hover)}}
.icon-btn svg{width:24px;height:24px}
.avatar{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#1565c0;color:#fff;font-size:15px;font-weight:700}
.tabs{display:flex;gap:0;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tab{position:relative;flex:none;height:40px;padding:8px 16px;border:0;background:none;font-size:14px;line-height:24px;font-weight:600;letter-spacing:.4px;color:var(--text-2)}
.tab[aria-selected="true"]{color:var(--primary)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--primary)}
.juke{position:relative;width:42px;height:42px;flex:none}
.juke>div,.juke div{position:absolute}
.juke .j-frame{inset:3.33% 13.33%}.juke .j-ang{inset:3.14% 3.16%}.juke .j-glow{inset:-22.94% -28.52% -29.12% -30%}
.juke .j-glow img{width:100%;height:100%;display:block}
.juke .j-body{inset:-5.18% 12.44% -5.18% 12.46%;background:#000;border:.07px solid #363636;border-radius:3.375px}
.juke .j-top{inset:0 0 10.22% 0;background:#000;border:.07px solid #363636;border-radius:3.375px 3.375px 1.055px 1.055px}
.juke .j-scr{inset:3.41% 6.91% 14.77% 6.92%;overflow:hidden;background:#170c20;border-radius:1.266px 1.266px .422px .422px}
.juke .j-scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.juke .j-scr img.ov{mix-blend-mode:overlay}
.juke .j-base{inset:89.78% 0 0 0}
.juke .j-base>div{inset:11.14% 2.13% 11.08% 2.13%;background:#030303;border:.07px solid #363636;border-radius:.563px .563px 2.672px 2.672px}
.juke .j-logo{inset:86.9% 79.36% 12.08% 6.81%}
.juke .j-logo svg{display:block;width:100%;height:100%}

main{padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.subtabs{margin:-8px 0 0;border-bottom:1px solid var(--divider)}
.dhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding:4px 4px 0}
.dtitle{margin:0;font-size:24px;line-height:1.334;font-weight:400;letter-spacing:0;color:var(--text)}
.dmeta{font-size:24px;line-height:1.334;color:var(--text);white-space:nowrap}
.card{background:var(--surface);border-radius:16px;min-width:0;box-shadow:0 5px 22px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.03);overflow:clip}
.card:has(.split-btn){overflow:visible;position:relative;z-index:5} /* let the actions menu hang over the table card */
.card-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:20px 16px 0}
.h3{margin:0;font-size:20px;line-height:1.3;font-weight:700;letter-spacing:.15px}
.body2{font-size:14px;line-height:20px;color:var(--text-2)}
.caption{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--text-2)}
hr{margin:0;border:0;border-top:1px solid var(--divider)}

/* capacity */
.cap{display:flex;flex-direction:column;gap:6px;min-width:240px;flex:1;max-width:420px}
.cap-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cap-top strong{font-size:16px;line-height:24px;font-weight:700;letter-spacing:.15px}
.cap.full .cap-top strong,.cap.over .cap-top strong{color:var(--error)}
.progress{height:4px;border-radius:0;background:rgba(34,112,168,.4);overflow:hidden;display:flex} /* <Progress> | Linear, Determinate, Secondary */
.progress i{display:block;height:100%}
.progress .p-fav{background:var(--primary)} .progress .p-add{background:var(--success)} .progress .p-over{background:var(--error)}
.cap.full .progress .p-fav{background:var(--error)}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--text-2);margin-left:auto}
.meta .ico{width:16px;height:16px;color:var(--action)}
.meta .sep{width:3px;height:3px;border-radius:50%;background:var(--text-2)}

/* <Alert> Standard (Material UI - for TouchTunes (v5.11.1)): radius 12, padding 6 16, icon 22, text 8px 0, action = small text button in content colour */
.alert{display:flex;align-items:flex-start;margin:0 16px 16px;padding:6px 16px;border-radius:12px;flex-wrap:wrap}
.alert>.ico{width:22px;height:22px;margin:7px 12px 7px 0}
.alert .a-msg{flex:1;min-width:220px;padding:8px 0;font-size:14px;line-height:1.43;letter-spacing:.17px}
.alert .a-msg b{font-weight:700}
.alert .a-act{display:flex;gap:8px;align-items:center;padding:4px 0 0 16px;flex-wrap:wrap}
.alert .a-act .btn{color:inherit;border-color:transparent;background:none;min-height:30px;padding:4px 5px;font-size:13px;line-height:22px;letter-spacing:.46px}
.alert .a-act .btn:hover{background:rgba(102,60,0,.06)}
.alert.warn{background:var(--warn-tint);color:var(--warn-ink)}.alert.warn>.ico{color:var(--warn-icon)}
.alert.info{background:var(--info-tint);color:var(--info-ink)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;padding:16px 16px 20px}
.tcard .sechead:first-child{padding-top:16px}
/* Search field = DS 2.0 search button, state "On clic" (Figma MrddiDwJLr2HfEVy3CRrlZ 1542:111811): 368px pill, 1px action/active border,
   padding 6px 16px, SearchRounded 20px (overhangs 4px left), gap 8, input 16/24 .15, placeholder text/disabled, close icon 20px on the right */
.search{position:relative;flex:0 1 368px;min-width:240px}
.search>.ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--action);pointer-events:none}
.search input{width:100%;height:36px;padding:5px 40px 5px 40px;border:1px solid var(--action);border-radius:100px;background:var(--surface);font-size:16px;line-height:24px;letter-spacing:.15px;color:var(--text);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:rgba(25,25,25,.38)}
.search input::-webkit-search-cancel-button{display:none}
@media (hover:hover){.search input:hover{border-color:rgba(0,0,0,.87)}}
.search input:focus-visible{outline:0;border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;padding:4px;border:0;border-radius:100px;background:none;color:var(--action);display:grid;place-items:center}
.search .clear:hover{background:var(--hover)}
.search .clear .ico{position:static;transform:none;width:20px;height:20px}
/* <ButtonGroup> (DS 2.0, Figma MrddiDwJLr2HfEVy3CRrlZ 43:29658): 1px action/active border, radius 20, padding-right 8, white;
   buttons radius 100, 6px 16px, 14/24 semibold .4; selected = filled (Tempo #2270a8 instead of NORAD green), white text;
   unselected text action/active; count bubble 20px min, 0 4px, radius 100, action/hover fill, 12px regular .4, gap 4 */
.tgroup{display:inline-flex;align-items:center;border:1px solid var(--action);border-radius:20px;overflow:hidden;background:var(--surface)} /* no extra right padding: the selected pill must reach either end */
.tgroup button{border:0;border-radius:100px;background:none;padding:6px 16px;font-size:14px;line-height:24px;font-weight:600;letter-spacing:.4px;color:var(--action);display:inline-flex;gap:4px;align-items:center}
@media (hover:hover){.tgroup button:not([aria-pressed="true"]):hover{background:var(--hover)}}
.tgroup button[aria-pressed="true"]{background:var(--primary);color:#fff}
.count{min-width:20px;height:20px;padding:0 4px;border-radius:100px;background:rgba(0,0,0,.04);color:inherit;font-size:12px;line-height:20px;font-weight:400;text-align:center;letter-spacing:.4px}
.tgroup button[aria-pressed="true"] .count{background:rgba(255,255,255,.16)}
.results{margin-left:auto;color:var(--text-2);font-size:16px;line-height:1.5;letter-spacing:.15px;white-space:nowrap}
.results b{font-size:20px;line-height:1.3;font-weight:700}
.tb-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* <Button> Color=Secondary (Material UI - for TouchTunes (v5.11.1)): radius 8; Medium 36 (6 16 / text 6 8), Small 30 (4 10 / text 4 5); outlined = 1px primary TEMPO/states/outlinedBorder */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:5px 15px;border-radius:8px;border:1px solid rgba(34,112,168,.5);background:transparent;color:var(--primary);font-size:14px;line-height:24px;font-weight:600;letter-spacing:.4px;white-space:nowrap;transition:background-color 150ms ease-out}
.btn .ico,.btn>svg{width:20px;height:20px;margin-left:-4px}
.btn.sm{min-height:30px;padding:3px 9px;font-size:13px;line-height:22px;letter-spacing:.46px}
.btn.sm .ico,.btn.sm>svg{width:18px;height:18px}
.btn.solid{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{background:var(--error);border-color:var(--error);color:#fff}
.btn.text{border-color:transparent;background:none;padding:6px 8px}
.btn.text.sm{padding:4px 5px}
.btn:disabled{border-color:rgba(0,0,0,.12);background:transparent;color:rgba(0,0,0,.38);cursor:not-allowed}
.btn.solid:disabled,.btn.danger:disabled{background:rgba(0,0,0,.12);border-color:transparent}
.btn.text:disabled{background:none;border-color:transparent}
@media (hover:hover) and (pointer:fine){
  .btn:not(:disabled):hover{background:rgba(34,112,168,.04)}
  .btn.solid:not(:disabled):hover{background:var(--primary-dark);border-color:var(--primary-dark)}
  .btn.danger:not(:disabled):hover{background:var(--error-dark);border-color:var(--error-dark)}
}
.btn:focus-visible{outline:0;box-shadow:0 0 0 3px rgba(34,112,168,.3)}
.linkbtn{border:0;background:none;color:var(--primary);font-weight:600;font-size:14px;padding:4px;margin:-4px;border-radius:8px}
.linkbtn.sm{font-size:13px;letter-spacing:.46px}
@media (hover:hover){.linkbtn:hover{background:rgba(34,112,168,.04)}}

/* Checkbox (library Checkbox, 18px box in a 36px hit area) */
/* <Checkbox> from "Material UI - for TouchTunes (v5.11.1)" (set 6543:43052). Tempo = Color=Secondary (primary TEMPO/main #2270a8);
   Medium: 24px Material icon in 9px padding = 42px round hit area. Unchecked = CheckBoxOutlineBlankOutlined in text/secondary;
   checked = CheckBoxFilled; indeterminate = IndeterminateCheckBoxFilled; hover = primary TEMPO/states/hover (4%);
   focus = primary TEMPO/states/focusVisible (30%); disabled = action/disabled (38%). */
.cb{position:relative;width:42px;height:42px;flex:none;display:grid;place-items:center;margin:-12px;border-radius:50%;transition:background-color 120ms ease-out}
.cb input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer;border-radius:50%;z-index:1}
.c-chk,.cbcol{cursor:pointer}
.cb .bx{position:relative;pointer-events:none;width:18px;height:18px;border:2px solid var(--text-2);border-radius:2px;display:grid;place-items:center;transition:background-color 120ms ease-out,border-color 120ms ease-out}
.cb .bx svg{position:absolute;inset:0;margin:auto;width:16px;height:16px;fill:#fff;opacity:0}
.cb input:checked+.bx,.cb input:indeterminate+.bx{background:var(--primary);border-color:var(--primary)}
.cb input:checked+.bx .ck{opacity:1}
.cb input:indeterminate+.bx .dash{opacity:1}
.cb input:indeterminate+.bx .ck{opacity:0}
.cb input:disabled+.bx{border-color:rgba(0,0,0,.38)}
.cb input:disabled:checked+.bx{background:rgba(0,0,0,.38);border-color:transparent}
.cb input:disabled{cursor:not-allowed}
.cb:has(input:focus-visible){background:rgba(34,112,168,.3)}
@media (hover:hover){.cb:has(input:not(:disabled)):hover{background:rgba(34,112,168,.04)}}

/* selection bar */
.selbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 24px 12px;padding:6px 8px 6px 16px;border-radius:8px;background:var(--primary-tint-2);min-height:48px}
.selbar b{font-weight:700;color:var(--primary);margin-right:auto}

/* section heads */
.sechead{display:flex;align-items:center;gap:8px;padding:12px 24px;font-size:14px;line-height:22px;font-weight:700;letter-spacing:.1px;flex-wrap:wrap}
.sechead .n{color:var(--text-2);font-weight:400}
.sechead .btn{margin-left:auto}

/* Data grid */
.gridwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-weight:600;color:var(--text);text-align:left;font-size:14px;line-height:24px;letter-spacing:.4px;height:56px;padding:16px;border-bottom:1px solid var(--divider);white-space:nowrap;background:var(--surface)}
th button{border:0;background:none;padding:0;font-weight:inherit;display:inline-flex;gap:4px;align-items:center}
th .ico{width:18px;height:18px;color:var(--action);margin:0 4px}
th .ico.desc{transform:rotate(180deg)}
td{height:52px;padding:12px 16px;border-bottom:1px solid var(--divider);vertical-align:middle}
td.n,th.n{text-align:right}

.c-chk{width:46px;padding:0 0 0 4px}
.c-chk .cb{margin:0}
.c-act{width:1%;white-space:nowrap;text-align:right;padding-right:16px}
tbody tr{transition:background-color 120ms ease-out}
@media (hover:hover){tbody tr:hover{background:var(--hover)}}
tr.sel{background:rgba(34,112,168,.08)}
@media (hover:hover){tr.sel:hover{background:var(--primary-tint-2)}}
tr.unavail td{color:var(--text-3)}
tr.d-add,tr.p-add{background:rgba(76,173,146,.06)}
tr.rem .ttl{text-decoration:line-through;text-decoration-color:var(--text-2)}
tr.rem td{color:var(--text-2)}
.tcell{display:flex;gap:12px;align-items:center;min-width:220px}
.art{width:40px;height:40px;border-radius:4px;background:#e0e0e0;flex:none;display:grid;place-items:center;color:rgba(0,0,0,.38)}
.art svg{width:20px;height:20px;fill:currentColor}
.t1{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.ttl{font-weight:700;letter-spacing:.1px;color:var(--text)}
.t2{color:var(--text-2);font-size:12px;line-height:16px;letter-spacing:0}
.marks{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:4px}
.marks:empty{display:none}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;background:rgba(0,0,0,.06);font-size:12px;line-height:20px;letter-spacing:.4px;color:var(--text-2)}
.onecr{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--text-2)}
.onecr svg{width:14px;height:14px;fill:#e53935}
/* <Chip> Small (Material UI - for TouchTunes (v5.11.1)): 24px, radius 100, padding 3px 4px + label 0 6px, 13/18 .16; draft = Default filled #f5f5f5; pending = Outlined in success/error; waiting = Outlined warning */
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:3px 10px;border:1px solid transparent;border-radius:100px;font-size:13px;line-height:18px;letter-spacing:.16px;white-space:nowrap}
.chip svg{width:16px;height:16px;fill:currentColor;margin-left:-4px}
.chip.d-add,.chip.d-rem{background:#f5f5f5;color:var(--text)}
.chip.p-add{border-color:var(--success);color:var(--success-ink)} /* override: main-colour border, darker text for contrast */
.chip.p-rem{border-color:var(--error);color:#6b1e35}
.chip.p-copy{border-color:var(--primary);color:var(--primary-dark);max-width:100%;white-space:nowrap}
.chip.p-copy .cl{overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100px}
.chip.p-copy .ct{flex:none;margin-left:4px}
.c-act .btn{display:flex;margin-left:auto}
.chip.wait{border-color:var(--warning);color:var(--warn-ink)}
.m-only{display:none}
.loadmore{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px}
.empty{padding:32px 24px;text-align:center;color:var(--text-2)}

/* catalog list */
.cat{border-top:8px solid var(--page)}
.res{display:flex;gap:12px;align-items:center;min-height:60px;padding:8px 24px;border-bottom:1px solid var(--divider)}
.res .cbcol{width:42px;flex:none;display:flex;margin-left:-12px}
.res .cbcol .cb,.cathead .cbcol .cb{margin:0}
.res .grow{flex:1;min-width:0}
.res .ttl{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .plays{color:var(--text-2);white-space:nowrap}
.res.sel{background:rgba(34,112,168,.08)}
.cathead .cbcol{width:42px;flex:none;margin-left:-12px;margin-right:2px}
.catmsg{margin:0 24px 12px}

/* changes bar */
.changes{position:sticky;bottom:12px;z-index:20;background:var(--surface);border-radius:16px;box-shadow:0 3px 5px -1px rgba(0,0,0,.2),0 6px 10px rgba(0,0,0,.14),0 1px 18px rgba(0,0,0,.12);padding:8px 16px;display:flex;flex-direction:column}
.crow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 0}
.crow+.crow{border-top:1px solid var(--divider)}
.crow .cicon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.crow .cicon svg{width:20px;height:20px;fill:currentColor}
.crow .cicon.draft{background:var(--primary-tint-2);color:var(--primary)}
.crow .cicon.pend{background:var(--success-tint);color:var(--success)}
.crow .cicon.wait{background:var(--warn-tint);color:var(--warn-icon)}
.crow .txt{flex:1;min-width:220px}
.crow .txt b{font-weight:700;font-size:16px;line-height:24px;letter-spacing:.15px;display:block}
.crow .acts{display:flex;gap:8px;flex-wrap:wrap}

/* notes */
.note{background:var(--note);color:var(--note-ink);border:1px solid var(--note-line);border-radius:3px;padding:7px 10px;font-size:12.5px;line-height:1.4;max-width:64ch;letter-spacing:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.note b{font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;margin-right:4px}
.noterow{display:flex;flex-wrap:wrap;gap:8px;padding:0 24px 16px}
.notes-off .note,.notes-off .noterow{display:none}

/* <Dialog> Max Width=small (Material UI - for TouchTunes (v5.11.1)): radius 20, elevation 24, title p16 h3 + close 24, content p24 between dividers, actions p16 gap 8 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:grid;place-items:center;padding:16px}
.dialog{background:var(--surface);border-radius:20px;overflow:clip;width:min(600px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 11px 15px -7px rgba(0,0,0,.2),0 24px 38px 3px rgba(0,0,0,.14),0 9px 46px 8px rgba(0,0,0,.12)}
.d-head{display:flex;align-items:center;gap:16px;padding:16px}
.d-head h2{flex:1;min-width:0}
.d-body{min-height:0;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--divider);border-bottom:1px solid var(--divider)}
.d-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px;flex-wrap:wrap}
.sum h4{margin:0 0 6px;font-size:14px;line-height:22px;font-weight:700;letter-spacing:.1px;display:flex;gap:8px;align-items:center}
.sum ul{margin:0;padding-left:20px;color:var(--text-2);display:flex;flex-direction:column;gap:2px}
.box{background:var(--box);border-radius:12px;padding:12px 16px;color:var(--text-2);display:flex;gap:10px;align-items:flex-start}
.box .ico{color:var(--action);margin-top:0}
.loclist{border:1px solid var(--divider);border-radius:12px;overflow:hidden}
.loc{display:flex;gap:12px;align-items:center;padding:10px 16px 10px 21px;border-bottom:1px solid var(--divider);cursor:pointer}
.loc:last-child{border-bottom:0}
.loc .grow{flex:1;min-width:0}
.loc .fs{color:var(--text-2);white-space:nowrap}
.loc .fs.full{color:var(--error)}

/* Snackbar */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;display:flex;align-items:center;gap:8px;min-width:288px;max-width:calc(100% - 32px);padding:6px 16px;min-height:48px;border-radius:12px;background:var(--snack);color:#fff;font-size:14px;line-height:20px;box-shadow:0 3px 5px -1px rgba(0,0,0,.2),0 6px 10px rgba(0,0,0,.14),0 1px 18px rgba(0,0,0,.12);transition:opacity 200ms ease-out,transform 200ms ease-out;pointer-events:none;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{flex:1;padding:8px 0;letter-spacing:.17px}
.toast button{border:0;background:none;color:var(--snack-action);font-weight:600;font-size:13px;line-height:22px;letter-spacing:.46px;padding:4px 5px;border-radius:8px}
.toast button:hover{background:rgba(255,255,255,.08)}

/* questions panel */
.oq{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;max-width:1480px;margin:24px auto 0;color:var(--proto-ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:0}
.oq section{background:var(--proto);border-radius:12px;padding:16px 18px}
.oq h3{margin:0 0 8px;font-size:15px;font-weight:600}
.oq ol,.oq ul{margin:0;padding-left:20px;color:var(--proto-ink-2);font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.oq b{color:var(--proto-ink);font-weight:600}


/* Locations side panel (from the user's Tempo screenshot: 12px-radius search + outlined "+ Add", bold name over ID) */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.fcol{min-width:0;display:flex;flex-direction:column;gap:16px}
.lp{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.lp-head{display:flex;align-items:baseline;gap:8px;padding:20px 16px 0}
.lp-head .n{color:var(--text-2)}
.lp-tools{display:flex;gap:8px;padding:16px}
.lsearch{position:relative;flex:1;min-width:0}
.lsearch>.ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--action);pointer-events:none}
.lsearch input{width:100%;height:36px;padding:5px 16px 5px 40px;border:1px solid var(--action);border-radius:100px;background:var(--surface);font-size:16px;line-height:24px;letter-spacing:.15px;color:var(--text);-webkit-appearance:none;appearance:none} /* same as the main search (DS 2.0 1542:111811) */
.lsearch input::-webkit-search-cancel-button{display:none}
@media (hover:hover){.lsearch input:hover{border-color:rgba(0,0,0,.87)}}
.lsearch input::placeholder{color:rgba(25,25,25,.38)}
.lsearch input:focus-visible{outline:0;border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.btn.lp-add{border-radius:12px;border-color:var(--primary);color:var(--primary);font-weight:700;padding:6px 12px;gap:4px}
.btn.lp-add svg{width:20px;height:20px;fill:currentColor}
.lp-list{list-style:none;margin:0;padding:0;overflow-y:auto;border-top:1px solid var(--divider)}
.lrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--divider);background:none;padding:12px 16px;min-height:68px}
.lrow .lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.lrow .ln{font-weight:700;font-size:14px;line-height:22px;letter-spacing:.1px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lid{display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px;color:var(--text)}
.lrow .lid svg{width:20px;height:20px;fill:#7e57c2}
.lrow .lbadge{flex:none;font-size:12px;line-height:16px;letter-spacing:.4px;padding:2px 8px;border-radius:100px;border:1px solid currentColor;white-space:nowrap}
.lrow .lbadge.d{color:var(--action)} .lrow .lbadge.p{color:var(--success)}
@media (hover:hover){.lrow:hover{background:var(--hover)}}
.lrow[aria-current="page"]{background:var(--primary-tint-2);box-shadow:inset 3px 0 var(--primary)}
.lp-empty{padding:16px;color:var(--text-2)}
@media (max-width:1100px){.split{grid-template-columns:1fr}.lp{position:static;max-height:none}.lp-list{max-height:280px}}
.nv{display:inline-flex;align-items:center;gap:8px;font-size:14px;line-height:20px;letter-spacing:.17px;color:var(--text)}
.nv-sw{position:relative;width:34px;height:20px;border-radius:10px;background:var(--primary)}
.nv-sw::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.24)}
.lrow .lid{color:var(--primary);font-weight:600}

/* TouchTunes playlists dialog */
.dialog.wide{width:min(900px,100%)}
.d-head .icon-btn{margin-right:-8px}
.pl-split{display:grid;grid-template-columns:200px minmax(0,1fr);border:1px solid var(--divider);border-radius:8px;overflow:hidden;min-height:380px}
.pl-cats{display:flex;flex-direction:column;border-right:1px solid var(--divider);background:var(--box);padding:8px 0}
.pl-cats button{border:0;background:none;text-align:left;padding:10px 16px;font-size:14px;line-height:20px;letter-spacing:.17px;color:var(--text)}
@media (hover:hover){.pl-cats button:hover{background:var(--hover)}}
.pl-cats button[aria-selected="true"]{background:rgba(34,112,168,.08);color:var(--primary);font-weight:600;box-shadow:inset 3px 0 var(--primary)}
.pl-list{list-style:none;margin:0;padding:0;overflow:auto;max-height:440px}
.pl-list button{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--divider);background:none;text-align:left;padding:12px 16px}
@media (hover:hover){.pl-list button:hover{background:rgba(34,112,168,.04)}}
.pl-list .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pl-list svg{width:20px;height:20px;fill:var(--action);flex:none}
.pl-tools{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.pl-table{border:1px solid var(--divider);border-radius:8px;max-height:440px;overflow:auto}
.pl-table th{position:sticky;top:0;z-index:2}
@media (max-width:700px){.pl-split{grid-template-columns:1fr}.pl-cats{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--divider);padding:0}.pl-cats button{white-space:nowrap}}

/* Search top right (DS 2.0 Reports pattern, Figma zzN3H1Pl4spV5Fm4hIR1Sj 9559:9262): outlined 36px icon button that opens the 368px search field */
.card-head{justify-content:space-between}
.ch-actions{margin-left:auto;display:flex;gap:16px;align-items:center;min-width:0}
.ch-actions .search{width:368px;max-width:100%;flex:0 1 368px}
.icon-btn.outlined{width:36px;height:36px;padding:5px;border:1px solid var(--action);color:var(--action)}
.icon-btn.outlined .ico{width:24px;height:24px}
/* Filter chip (DS 2.0 <Chip> default fill + CancelRounded) */
.fchip{display:inline-flex;align-items:center;gap:2px;height:32px;padding:4px 4px 4px 10px;border-radius:100px;background:#f5f5f5;color:var(--text);font-size:13px;line-height:18px;letter-spacing:.16px;white-space:nowrap}
.fchip button{border:0;background:none;padding:0;width:24px;height:24px;display:grid;place-items:center;color:rgba(0,0,0,.26);border-radius:50%}
.fchip button:hover{color:rgba(0,0,0,.56)}
.fchip .ico{width:24px;height:24px}

/* Keep the table inside its card (no sideways scrolling to reach Remove / Cancel) */
.tcard .tcell{min-width:160px}
.tcard .chip{height:auto;min-height:24px}
@media (max-width:1360px){.tcard .chip{white-space:normal}} /* wraps only on narrow screens */
.tcard td{padding-left:12px;padding-right:12px}
.tcard .c-chk{padding-left:4px;padding-right:0}
.tcard .c-act{padding-right:16px}

/* Split button (MUI ButtonGroup contained + ArrowDropDown): Remove is the primary action, other actions in the menu */
.split-btn{position:relative;display:inline-flex}
.split-btn .sb-main{border-radius:8px 0 0 8px}
.split-btn .sb-arrow{border-radius:0 8px 8px 0;padding:5px 6px;border-left:1px solid rgba(255,255,255,.5)}
.split-btn .sb-arrow:disabled{border-left-color:rgba(0,0,0,.12)}
.split-btn .sb-arrow svg{width:24px;height:24px;fill:currentColor}
.sb-menu{position:absolute;top:calc(100% + 4px);left:0;min-width:100%;background:var(--surface);border-radius:8px;padding:8px 0;z-index:30;box-shadow:0 5px 5px -3px rgba(0,0,0,.2),0 8px 10px 1px rgba(0,0,0,.14),0 3px 14px 2px rgba(0,0,0,.12)}
.sb-menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 16px;font-size:16px;line-height:24px;letter-spacing:.15px;color:var(--text);white-space:nowrap}
.sb-menu button:hover,.sb-menu button:focus-visible{background:var(--hover);outline:0}
.sb-menu button:disabled{color:rgba(0,0,0,.38);background:none;cursor:default}
@media (prefers-reduced-motion:reduce){.toast,.btn,tbody tr{transition:none}}
.c-last,.c-added,td.n{white-space:nowrap}
@media (max-width:1500px){.c-avail{display:none}}
@media (max-width:1280px){.c-style{display:none}}
@media (max-width:899px){.frame{grid-template-columns:1fr}.sidenav{display:none}.head-actions{display:none}}
@media (max-width:700px){
  .c-artist,.c-style,.c-last,.c-added,.c-avail,.c-act{display:none}
  .m-only{display:block}
  .tcell{min-width:0}
  .device-id{font-size:26px}
  main{padding:12px 8px 16px}
  .card-head,.toolbar,.noterow{padding-left:16px;padding-right:16px}
  .alert,.selbar,.catmsg{margin-left:16px;margin-right:16px}
  .sechead,.res{padding-left:16px;padding-right:16px}
  .c-chk{padding-left:16px}
  .res .plays{display:none}
}

/* ---------- Pulse alignment ----------
   Values from the Pulse code (TouchTunes/web-pulse, packages/components/src/theme + components) with the Tempo palette
   from packages/components/.storybook/themes.ts. These win over the Figma library values above. */
:root{
  --text:#222222; --text-2:#717275; --error:#ff4656; --error-dark:#cc3845;
  --primary-dark:#1b5a86;            /* contained hover = 20% black over primary */
  --divider:rgba(0,0,0,.12);         /* theme.palette.divider */
  --grey-600:#757575; --grey-200:#ececec;
  --snack:#313131;                    /* notistack default */
}
/* MuiButton: radius 12; medium 8px 16px, 14/1.4 semibold .4; small 6px 10px, 13/1.4 .46; text = same padding, hover brightness .8, no fill */
.btn{border-radius:12px;min-height:0;padding:8px 16px;line-height:1.4;letter-spacing:.4px}
.btn.sm{padding:6px 10px;line-height:1.4;letter-spacing:.46px}
.btn.text{padding:8px 16px}
.btn.text.sm{padding:6px 10px}
@media (hover:hover) and (pointer:fine){
  .btn:not(:disabled):hover{background:rgba(34,112,168,.05)}
  .btn.text:not(:disabled):hover{background:none;filter:brightness(.8)}
}
.alert .a-act .btn{padding:6px 10px}
.linkbtn{border-radius:12px}
/* ButtonGroup split button: same 12px outer radius */
.split-btn .sb-main{border-radius:12px 0 0 12px}
.split-btn .sb-arrow{border-radius:0 12px 12px 0;padding:6px 8px}
.split-btn.sm .sb-arrow{padding:3px 4px}
.split-btn.sm .sb-arrow svg{width:20px;height:20px}
/* MuiMenu: paper radius 12, items 8px 16px */
.sb-menu{border-radius:12px}
.sb-menu button{padding:8px 16px}
/* SearchInput: 38px pill, 1px grey.600 border in every state, 24px SearchRounded in grey.600, 14px text, 18px close icon */
.search input,.lsearch input{height:38px;padding:8px 36px 8px 38px;border-color:var(--grey-600);font-size:14px;line-height:20px;letter-spacing:.17px}
.lsearch input{padding-right:12px}
.search input::placeholder,.lsearch input::placeholder{color:rgba(34,34,34,.42)}
@media (hover:hover){.search input:hover,.lsearch input:hover{border-color:var(--grey-600)}}
.search input:focus-visible,.lsearch input:focus-visible{border-color:var(--grey-600);box-shadow:none}
.search>.ico,.lsearch>.ico{left:8px;width:24px;height:24px;color:var(--grey-600)}
.search .clear{right:6px;color:var(--grey-600)}
.search .clear .ico{width:18px;height:18px}
@media (hover:hover){.search .clear:hover{background:none}}
/* MuiTab: 42px, 8px 16px, hover = 8% primary fill + secondary text */
.tab{height:42px;line-height:1.43;letter-spacing:.17px;transition:background-color 150ms ease-out}
@media (hover:hover){.tab:hover{background:rgba(34,112,168,.08);color:var(--text-2)}}
/* MuiIconButton: 6px padding, no hover fill */
@media (hover:hover){.icon-btn:hover{background:none}}
/* MuiDataGrid: header/cell padding 16px 8px, semibold titles, no column separators, sortable header hover = grey.200,
   no row hover, selected row = 8% primary */
th{padding:16px 8px;letter-spacing:.15px}
td,.tcard td{padding:16px 8px;font-size:14px;line-height:20.02px;letter-spacing:.15px} /* Pulse DataGrid cell (hosted Storybook, Tempo theme) */
.tcard .c-chk,th.c-chk{padding:0 0 0 8px}
.tcard .c-act{padding-right:16px}
th:has(button){transition:background-color 150ms ease-out}
@media (hover:hover){
  th:has(button):hover{background:var(--grey-200)}
  tbody tr:hover{background:transparent}
  tr.sel:hover{background:rgba(34,112,168,.08)}
}
/* Dialog paper: theme shape radius 16 */
.dialog{border-radius:16px}
/* notistack default snackbar: #313131, radius 4; kept centred at the bottom (user's choice) */
.toast{left:50%;bottom:20px;transform:translate(-50%,16px);border-radius:4px;box-shadow:0 3px 5px -1px rgba(0,0,0,.2),0 6px 10px 0 rgba(0,0,0,.14),0 1px 18px 0 rgba(0,0,0,.12)}
.toast.show{transform:translate(-50%,0)}
.toast button{border-radius:12px}
</style>

function buildFavs(li){
  seed = 11 + li*13;
  const base = parse(FAV_RAW,"f"+li+"_");
  const rot = (li*17) % base.length;
  return base.slice(rot).concat(base.slice(0,rot)).map((s,i)=>{
    const plays = Math.max(0, Math.round(150*Math.exp(-i/26) + rnd()*8 - 3));
    const lastDays = plays===0 ? null : Math.floor(rnd()*(plays>25?3:plays>6?14:45));
    const added = TODAY_TS - Math.round(30 + rnd()*500)*DAY;
    return Object.assign(s,{plays,last:lastDays===null?null:TODAY_TS-lastDays*DAY,added,avail:s.title!=="Callaita",st:null});
  });
}

const QS = new URLSearchParams(location.search), TEST = QS.has("test"), TEST_START = QS.get("start");
const L_WHIMSICAL = "L14102", L_PLAYDIUM = "L17215";
function testMarkers(){
  const here = t => S.favs.find(f=>f.title===t);
  const pAddsAt = lid => { const st=locState(lid); return st ? st.favs.filter(f=>f.st==="pAdd") : []; };
  const out = [];
  if (S.q && S.q.trim().length>=3 && rows().some(f=>f.title==="Tennessee Whiskey")) out.push("done-find");
  const ww = here("Wagon Wheel"); if (ww && ww.st==="pRem" && !ww.remo) out.push("done-remove-here");
  const mb = here("Mr. Brightside"); if (mb && mb.st==="pRem" && mb.remo && mb.remo.refs.some(r=>r.loc===L_PLAYDIUM)) out.push("done-remove-multi");
  if (pAddsAt(L_WHIMSICAL).some(f=>f.title==="Bad Moon Rising")) out.push("done-add-other");
  const ch = new Set(PLAYLISTS.find(p=>p.name==="Country Hits").songs().map(so=>so.title+"|"+so.artist));
  if (pAddsAt(L_WHIMSICAL).filter(f=>ch.has(f.title+"|"+f.artist)).length>=3) out.push("done-add-playlist");
  if (TEST_START==="pending" && !pendingByLoc().length) out.push("done-cancel-all");
  return out;
}
let testPrev = [];
function testSync(){
  if (!TEST) return;
  const cur = location.hash.slice(1), list = testMarkers(), fresh = list.filter(m=>!testPrev.includes(m));
  testPrev = list;
  // The task finished most recently wins; undoing it falls back to one that is still done, or clears the marker.
  const want = fresh.length ? fresh[fresh.length-1] : list.includes(cur) ? cur : list[list.length-1];
  if (want && want!==cur) location.hash = want;
  else if (!want && cur) history.replaceState(null, "", location.pathname+location.search);
}

let toastTimer;
function toast(msg, undo){
  let t = document.querySelector(".toast");
  if (!t){ t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>${undo?`<button type="button">Undo</button>`:""}`;
  if (undo) t.querySelector("button").onclick = () => { undo(); t.classList.remove("show"); render(); };
  requestAnimationFrame(()=>t.classList.add("show"));
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"), undo?6000:4000);
}

/* Add to more locations: catalog songs become pending adds at each chosen location that doesn't have them and has room.
   A row added here gets an "Adding at N other locations" status until the 2 AM update. */
function addMore(cids, locIds, here){
  const before = S.favs.slice();
  const added = [], noRoom = [];
  if (here) for (const id of cids){ const f = addSong(id,true); if (f) added.push(f); else noRoom.push(CATALOG.find(c=>c.id===id).title); }
  const refs = {}; let skipped = 0;
  for (const lid of locIds){
    const st = S.ls[lid] || (S.ls[lid] = initLoc(lid));
    for (const cid of cids){
      const c = CATALOG.find(x=>x.id===cid);
      if (locHasSong(lid, c) || CAP - countFor(lid) <= 0){ skipped++; continue; }
      const t = mk(c, "pAdd"); st.favs.push(t);
      (refs[cid] = refs[cid] || []).push({loc:lid, fid:t.id});
    }
  }
  for (const f of added){ if (refs[f.from]) f.addo = {refs:refs[f.from]}; }
  S.catSel.clear();
  render();
  // Say exactly what happens: songs added here, songs added elsewhere, and what didn't fit.
  const otherN = Object.values(refs).reduce((a,r)=>a+r.length,0), otherLocs = new Set(Object.values(refs).flat().map(r=>r.loc)).size;
  const parts = [];
  if (added.length) parts.push(`${plural(added.length,"song")} ${otherN?"here":""}`.trim());
  if (otherN) parts.push(`${plural(otherN,"add")} at ${plural(otherLocs,"other location")}`);
  const names = a => a.length<=2 ? a.map(t=>`“${t}”`).join(" and ") : `“${a[0]}”, “${a[1]}” and ${a.length-2} more`;
  const msg = parts.length ? `Adding ${parts.join(" and ")} to Favorites ${NEXT}.` : `Nothing was added.`;
  const miss = (noRoom.length ? ` No room here for ${names(noRoom)}.` : "") + (skipped ? ` ${plural(skipped,"add")} skipped at other locations (already there or no room).` : "");
  toast(msg + miss, () => {
    S.favs.splice(0, S.favs.length, ...before);
    for (const cid in refs) for (const r of refs[cid]){ const st=S.ls[r.loc]; const i=st.favs.findIndex(x=>x.id===r.fid); if (i>=0) st.favs.splice(i,1); }
  });
}
function unaddo(id){

  for (const r of f.addo.refs){ const st=S.ls[r.loc]; if (!st) continue; const i=st.favs.findIndex(x=>x.id===r.fid && x.st==="pAdd"); if (i>=0) st.favs.splice(i,1); }

/* Cancel pending changes, across locations: every location with changes waiting for the 2 AM update. */
function pendingByLoc(){
  return LOCATIONS.map(l=>{ const st=locState(l.id); const p = st ? st.favs.filter(f=>f.st==="pAdd"||f.st==="pRem") : [];
    return {l, adds:p.filter(f=>f.st==="pAdd").length, rems:p.filter(f=>f.st==="pRem").length}; }).filter(x=>x.adds+x.rems>0);
}
function cancelPending(locIds){
  // snapshot every location's rows for Undo
  const snap = LOCATIONS.map(l=>{ const st=locState(l.id); return st ? {st, favs:st.favs.slice(), rows:st.favs.map(f=>[f,f.st,f.copy,f.remo,f.addo])} : null; }).filter(Boolean);
  let n = 0;
  for (const id of locIds){ const st=locState(id); if (!st) continue;
    for (let i=st.favs.length-1;i>=0;i--){ const f=st.favs[i];
      if (f.st==="pAdd"){ st.favs.splice(i,1); n++; } else if (f.st==="pRem"){ f.st=null; n++; } }
  }
  // drop "at other locations" links that point at cancelled changes
  for (const l of LOCATIONS){ const st=locState(l.id); if (!st) continue;
    for (const f of st.favs) for (const k of ["copy","remo","addo"]) if (f[k]){
      f[k].refs = f[k].refs.filter(r=>{ const t=locState(r.loc); return t && t.favs.some(x=>x.id===r.fid && (x.st==="pAdd"||x.st==="pRem")); });
      if (!f[k].refs.length) delete f[k];
    }
  }
  S.selected.clear(); render();
  toast(`Cancelled ${plural(n,"pending change")} at ${plural(locIds.length,"location")}.`, () => {
    for (const x of snap){ x.st.favs.splice(0, x.st.favs.length, ...x.favs); for (const [f,st,c,r,a] of x.rows){ f.st=st; c?f.copy=c:delete f.copy; r?f.remo=r:delete f.remo; a?f.addo=a:delete f.addo; } }
  });
}
function removeSongs(ids){
  const done=[];
  for (const id of ids){
    const f = S.favs.find(x=>x.id===id); if (!f || isRem(f)) continue;
    const prev = f.st;
    if (f.st==="dAdd" || f.st==="pAdd"){ S.favs.splice(S.favs.indexOf(f),1); done.push({f,prev,cancel:true}); }
    else { f.st = S.model==="draft" ? "dRem" : "pRem"; f.chg=++chSeq; done.push({f,prev}); }
  }
  S.selected.clear();
  if (S.model==="instant" && done.length){
    const r = done.filter(d=>!d.cancel).length, c = done.length-r;
    toast([r?`${plural(r,"song")} will be removed from Favorites ${NEXT}`:"", c?`${plural(c,"add")} cancelled`:""].filter(Boolean).join(" · ")+".", () => {
      for (const d of done){ if (d.cancel) S.favs.push(Object.assign(d.f,{st:d.prev})); else d.f.st = d.prev; }
    });
  }
}
function undoOne(id){
  const f = S.favs.find(x=>x.id===id); if (!f) return;
  if (f.st==="dAdd"||f.st==="pAdd"){ S.favs.splice(S.favs.indexOf(f),1); if (f.st==="pAdd") toast(`Cancelled. ${f.title} won't be added.`); return; }

}
function undoDrafts(){

}
function send(locs){

  for (const f of drafts()) f.st = f.st==="dAdd" ? "pAdd" : "pRem";

}
function callin(){
  let a=0, r=0;
  const apply = st => { st.favs.forEach(f=>{ delete f.copy; delete f.remo; delete f.addo; }); a+=st.favs.filter(f=>f.st==="pAdd").length; r+=st.favs.filter(f=>f.st==="pRem").length; st.favs = st.favs.filter(f=>f.st!=="pRem"); st.favs.forEach(f=>{ if(f.st==="pAdd") f.st=null; }); };
  apply(S); Object.values(S.ls).forEach(apply);
  S.missed=false; S.selected.clear(); if (S.filter==="changes" && !drafts().length) S.filter="all";
  render(); toast(a||r ? `Jukeboxes updated at 2 AM: ${a} added to Favorites, ${r} removed from Favorites.` : "Jukeboxes called in at 2 AM. Nothing was waiting.");
}

function rows(){
  let r = S.favs.slice();
  const q = S.q.trim().toLowerCase();
  if (q) r = r.filter(f=>(f.title+" "+f.artist+" "+f.style).toLowerCase().includes(q));
  if (S.filter==="changes") r = r.filter(f=>f.st);
  const k=S.sort.key, d=S.sort.dir==="asc"?1:-1;
  r.sort((a,b)=>{ if(k==="title"||k==="artist") return a[k].localeCompare(b[k])*d; let x=a[k],y=b[k]; if(x===null)x=-1; if(y===null)y=-1; return (x-y)*d || a.title.localeCompare(b.title); });
  // Review area: every song with a change (add or remove, unsent or pending) is pinned at the top, newest change first, whatever the sort.
  const changed = r.filter(f=>f.st||f.copy||f.remo||f.addo).sort((x,y)=>(y.chg||0)-(x.chg||0));
  r = changed.concat(r.filter(f=>!f.st&&!f.copy&&!f.remo&&!f.addo));
  return r;
}

/* Add to other locations (was Copy): each chosen song becomes a pending add at the target location (if it has room and doesn't have the song),
   and the source row gets an "Adding at N other locations" status until the 2 AM update. */
function locHasSong(lid, f){
  const st = S.ls[lid] || (S.ls[lid] = initLoc(lid));
  return st.favs.some(x=>x.title===f.title && x.artist===f.artist && x.st!=="dRem" && x.st!=="pRem");
}
function copySongs(ids, locIds){
  const refsBySong = {}; const skipped = {};
  for (const lid of locIds){
    const st = S.ls[lid] || (S.ls[lid] = initLoc(lid));
    for (const id of ids){
      const f = S.favs.find(x=>x.id===id); if (!f) continue;
      const has = st.favs.some(x=>x.title===f.title && x.artist===f.artist && x.st!=="dRem" && x.st!=="pRem");
      const room = CAP - countFor(lid);
      if (has || room<=0){ skipped[lid]=(skipped[lid]||0)+1; continue; }
      const t = mk({id:"cp", title:f.title, artist:f.artist, style:f.style, tags:f.tags}, "pAdd");
      st.favs.push(t);
      (refsBySong[id] = refsBySong[id] || []).push({loc:lid, fid:t.id});
    }
  }
  let n=0;
  for (const id of ids){
    const f = S.favs.find(x=>x.id===id); const refs = refsBySong[id]; if (!f || !refs) continue;
    f.copy = {refs:(f.copy?f.copy.refs:[]).concat(refs)}; f.chg = ++chSeq; n++;
  }
  render();
  const names = locIds.map(i=>LOCATIONS.find(l=>l.id===i).name);
  const sk = Object.values(skipped).reduce((a,b)=>a+b,0);
  toast(`${plural(n,"song")} will be added to Favorites at ${plural(locIds.length,"location")} ${NEXT}.${sk?` ${plural(sk,"add")} skipped (already there or no room).`:""}`, () => { for (const id of ids) uncopy(id); });
}
/* Remove from more locations: matching songs at the other locations become pending removals,
   and the source row gets a "Leaving Favorites at N other locations" status until the 2 AM update. */
function removeMore(ids, locIds, here){
  const snap = S.favs.slice(), prevSt = new Map(S.favs.map(f=>[f,[f.st,f.chg]]));
  const refsBySong = {};
  for (const lid of locIds){
    const st = S.ls[lid] || (S.ls[lid] = initLoc(lid));
    for (const id of ids){
      const f = S.favs.find(x=>x.id===id); if (!f) continue;
      const t = st.favs.find(x=>x.title===f.title && x.artist===f.artist && !x.st); if (!t) continue;
      t.st = "pRem"; t.chg = ++chSeq;
      (refsBySong[id] = refsBySong[id] || []).push({loc:lid, fid:t.id});
    }
  }
  for (const id of ids){
    const f = S.favs.find(x=>x.id===id); const refs = refsBySong[id]; if (!f || !refs) continue;
    f.remo = {refs:(f.remo?f.remo.refs:[]).concat(refs)}; f.chg = ++chSeq;
  }
  if (here) removeSongs(ids); else S.selected.clear();
  render();
  const n = locIds.length + (here?1:0);
  const when = here && S.model==="draft" ? "when you send (here) and "+NEXT+" (other locations)" : NEXT;
  toast(`${plural(ids.length,"song")} will be removed from Favorites at ${plural(n,"location")} ${when}.`, () => {
    for (const id of ids) unremo(id);
    S.favs.splice(0, S.favs.length, ...snap); for (const [f,[st,chg]] of prevSt){ f.st=st; f.chg=chg; }
  });
}
function unremo(id){
  const f = S.favs.find(x=>x.id===id); if (!f || !f.remo) return;
  for (const r of f.remo.refs){ const st=S.ls[r.loc]; if (!st) continue; const t=st.favs.find(x=>x.id===r.fid && x.st==="pRem"); if (t) t.st=null; }
  delete f.remo;
}
function remoChip(f){
  if (!f.remo || f.st) return ""; /* merged into stChip */
  const locs = [...new Set(f.remo.refs.map(r=>r.loc))].map(id=>LOCATIONS.find(l=>l.id===id).name);
  return `<span class="chip p-rem" title="Leaving Favorites at ${esc(locs.join(", "))}">${I.clock}Leaving Favorites at ${locs.length} other location${locs.length===1?"":"s"} at 2 AM</span>`;
}
function uncopy(id){
  const f = S.favs.find(x=>x.id===id); if (!f || !f.copy) return;
  for (const r of f.copy.refs){ const st=S.ls[r.loc]; if (!st) continue; const i=st.favs.findIndex(x=>x.id===r.fid && x.st==="pAdd"); if (i>=0) st.favs.splice(i,1); }
  delete f.copy;
}
function copyChip(f){
  if (!f.copy) return "";
  const locs = [...new Set(f.copy.refs.map(r=>r.loc))].map(id=>LOCATIONS.find(l=>l.id===id).name);
  return `<span class="chip p-add" title="Adding at ${esc(locs.join(", "))}">${I.clock}Adding at ${locs.length} other location${locs.length===1?"":"s"} at 2 AM</span>`;
}
/* One status per row: a change here and the same change at other locations merge into one chip ("at N locations"). */
function otherLocNames(x){ return x ? [...new Set(x.refs.map(r=>r.loc))].map(id=>LOCATIONS.find(l=>l.id===id).name) : []; }
function stChip(f){
  const rem = f.st==="dRem"||f.st==="pRem", add = f.st==="dAdd"||f.st==="pAdd";
  const others = otherLocNames(rem ? f.remo : add ? f.addo : null);
  if (others.length){
    const n = others.length+1, where = esc(["This location"].concat(others).join(", "));
    const draft = f.st[0]==="d";
    const label = rem ? `Leaving Favorites at ${n} locations${draft?" · here when you send":" at 2 AM"}` : `Adding at ${n} locations${draft?" · here when you send":" at 2 AM"}`;
    return `<span class="chip ${rem?"p-rem":"p-add"}" title="${where}">${draft?I.edit:I.clock}${label}</span>`;
  }
  if (f.st==="dAdd") return `<span class="chip d-add">${I.edit}Will add when you send</span>`;
  if (f.st==="dRem") return `<span class="chip d-rem">${I.edit}Will leave Favorites when you send</span>`;
  if (f.st==="pAdd") return `<span class="chip ${S.missed?"wait":"p-add"}">${S.missed?I.warnf:I.clock}${S.missed?"Adding · waiting for jukebox":"Adding at 2 AM"}</span>`;
  if (f.st==="pRem") return `<span class="chip ${S.missed?"wait":"p-rem"}">${S.missed?I.warnf:I.clock}${S.missed?"Leaving Favorites · waiting for jukebox":"Leaving Favorites at 2 AM"}</span>`;
  return "";
}
function rowHTML(f){

  return `<tr class="${cls}">

    <td class="c-avail">${f.avail?"Available":"Unavailable"}</td><td class="c-act">${act}${f.st?"":actR+actA}</td></tr>`;

  // Keep scroll positions of inner scrolling areas (e.g. a table scrolled sideways to reach Remove) across re-renders.
  const SCROLLERS = ".gridwrap, .pl-table, .lp-list, .pl-list, .d-body";
  const keep = [...document.querySelectorAll(SCROLLERS)].map(el=>[el.scrollLeft, el.scrollTop]);
  document.body.classList.toggle("notes-off", !S.notes);
  document.getElementById("proto").innerHTML = protoBar();
  document.getElementById("phead").innerHTML = pageHead();
  document.getElementById("main").innerHTML = mainHTML();
  document.getElementById("oq").innerHTML = questions();
  document.getElementById("modal").innerHTML = modal();
  document.querySelectorAll(SCROLLERS).forEach((el,i)=>{ if (keep[i]){ el.scrollLeft=keep[i][0]; el.scrollTop=keep[i][1]; } });
  // indeterminate states
  const sp=document.getElementById("selpage");
  if (sp){ const vis=rows().slice(0,S.q?undefined:S.shown).filter(f=>!f.st); const on=vis.filter(f=>S.selected.has(f.id)).length; sp.indeterminate = on>0 && on<vis.length; }
  const ca=document.getElementById("catall");
  if (ca && !ca.checked){ ca.indeterminate = document.querySelectorAll('[data-act=catsel]:checked').length>0; }
  const menuOpen = !!S.actsOpen, openedModal = S.modal && S.modal!==wasModal, closedModal = !S.modal && wasModal;
  if (openedModal){
    // Dialog opened: move focus into it (search field first, else the first enabled control in the body, else Close)
    const d = document.querySelector(".dialog");
    const first = d.querySelector("#cq") || d.querySelector(".d-body input:not(:disabled), .d-body button:not(:disabled)") || d.querySelector("[data-act=close]");
    first && first.focus();
  } else if (closedModal){
    // Dialog or menu closed: return focus to what opened it (menu items fall back to the arrow button)
    const sel = opener ? `[data-act="${opener.act}"]${opener.id?`[data-id="${opener.id}"]`:""}` : null;
    const back = (sel && document.querySelector(sel)) || document.querySelector("[data-act=actsmenu]");
    back && back.focus();
  } else if (menuOpen && !wasMenu){
    const it = document.querySelector(".sb-menu button:not(:disabled)") || document.querySelector("[data-act=actsmenu]"); it && it.focus();
  } else if (aid && aid!=="selpage" && aid!=="catall"){ const el=document.getElementById(aid); if (el){ el.focus(); if (ss!=null && el.setSelectionRange) try{el.setSelectionRange(ss,ss);}catch(_){} } }
  else if (aeAct){ const el=document.querySelector(`[data-act="${aeAct}"]${aeId?`[data-id="${aeId}"]`:""}${aeV?`[data-v="${aeV}"]`:""}`); el && el.focus(); } // keep keyboard focus on the control that was used
  wasModal = S.modal; wasMenu = menuOpen;
  testSync();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  if ((S.actsOpen||S.addOpen) && !e.target.closest(".split-btn")){ S.actsOpen=false; S.addOpen=false; if (!e.target.closest("[data-act]")){ render(); return; } }
  let t = e.target.closest("[data-act]");
  if (t && !S.modal && !t.closest(".dialog")){ const inMenu = !!t.closest(".sb-menu"); opener = inMenu ? {act:"actsmenu"} : {act:t.dataset.act, id:t.dataset.id}; }
  // Checkboxes: a click anywhere in the checkbox cell (the 42px circle or the table cell around it) toggles it.
  // (Rows inside <label class="loc"> already forward clicks natively, so they are left alone.)
  const cell = !e.target.closest("label") && e.target.closest(".c-chk, .cbcol, .cb");
  const inp = cell && cell.querySelector('.cb input[type="checkbox"]');
  if (inp && e.target !== inp){ if (!inp.disabled) inp.click(); return; }
  if (!t) return;
  const act=t.dataset.act, id=t.dataset.id, v=t.dataset.v;
  if (t.tagName==="A") e.preventDefault();
  switch(act){
    case "noop": return;
    case "actsmenu": S.actsOpen=!S.actsOpen; render(); return;
    case "locgo": switchLoc(id); render(); window.scrollTo({top:0}); return;
    case "set":
      if (t.dataset.k==="model"){ if (drafts().length && v==="instant"){ for (const f of drafts()) f.st = f.st==="dAdd"?"pAdd":"pRem"; } S.model=v; try{history.replaceState(null,"","#"+v);}catch(_){} render(); }
      else if (t.dataset.k==="size"){ fresh({model:S.model,size:v,missed:S.missed,notes:S.notes}); render(); }
      return;
    case "missed": S.missed=!S.missed; if (S.missed) seedMissed(); render(); return;
    case "callin": callin(); return;
    case "notes": S.notes=!S.notes; render(); return;
    case "reset": fresh({model:S.model,loc:S.loc,notes:S.notes}); render(); toast("Prototype reset."); return;
    case "clearq": S.q=""; render(); document.getElementById("q").focus(); return;
    case "searchopen": S.searchOpen=true; render(); document.getElementById("q").focus(); return;
    case "filter": S.filter=v; S.shown=25; render(); return;
    case "showchanges": S.filter="changes"; S.q=""; render(); document.getElementById("fav-title").scrollIntoView({block:"start"}); return;
    case "sort": S.sort = S.sort.key===v ? {key:v,dir:S.sort.dir==="asc"?"desc":"asc"} : {key:v,dir:(v==="title"||v==="artist")?"asc":"desc"}; render(); return;
    case "more": S.shown+=25; render(); return;
    case "toggle": S.selected.has(id)?S.selected.delete(id):S.selected.add(id); render(); return;
    case "selpage": { const r=rows().slice(0,S.q?undefined:S.shown).filter(f=>!f.st); const all=r.every(f=>S.selected.has(f.id)); r.forEach(f=>all?S.selected.delete(f.id):S.selected.add(f.id)); render(); return; }
    case "clearsel": S.selected.clear(); render(); return;
    case "leastplayed": S.q=""; S.filter="all"; S.sort={key:"plays",dir:"asc"}; S.shown=25; render(); return;
    case "selleast": { S.q=""; S.filter="all"; S.sort={key:"plays",dir:"asc"}; const k=+v; S.shown=Math.max(25,Math.ceil(k/25)*25); S.selected=new Set(S.favs.filter(f=>!f.st).sort((a,b)=>a.plays-b.plays).slice(0,k).map(f=>f.id)); render(); return; }
    case "catsel": S.catSel.has(id)?S.catSel.delete(id):S.catSel.add(id); render(); return;
    case "catall": { const ids=[...document.querySelectorAll('[data-act=catsel]')].map(x=>x.dataset.id); const on=ids.filter(i=>S.catSel.has(i)); if (on.length && (on.length===ids.length || on.length>=free())) ids.forEach(i=>S.catSel.delete(i)); else ids.slice(0,free()).forEach(i=>S.catSel.add(i)); render(); return; }
    case "addsel": addSelected([...document.querySelectorAll('[data-act=catsel]:checked')].map(x=>x.dataset.id)); render(); return;
    case "removeone": removeSongs([id]); render(); return;
    case "removesel": S.actsOpen=false; S.modal={type:"removemore",locs:new Set(),here:true}; render(); return; /* opens the location picker (this location checked); Undo in the snackbar, Cancel on rows */
    case "doremove": S.modal=null; removeSongs([...S.selected]); render(); return;
    case "undo": unaddo(id); undoOne(id); unremo(id); render(); return;
    case "unremo": unremo(id); render(); toast("Cancelled. The song stays in Favorites at the other locations."); return;
    case "addsongs": S.actsOpen=false; S.catSel.clear(); S.modal={type:"addsongs",q:""}; render(); document.getElementById("cq")?.focus(); return;
    case "addnext": { const M=S.modal; S.modal={type:"addmore",locs:new Set(),here:free()>0,back:{q:M.q||"",tab:M.tab,cat:M.cat,pl:M.pl}}; render(); return; }
    case "addback": S.modal=Object.assign({type:"addsongs"}, S.modal.back); render(); return;
    case "cancelpending": S.actsOpen=false; S.modal={type:"cancelpending",locs:new Set(pendingByLoc().map(x=>x.l.id))}; render(); return;
    case "cpall": { const ids=pendingByLoc().map(x=>x.l.id), L=S.modal.locs; const all=ids.every(i=>L.has(i)); ids.forEach(i=>all?L.delete(i):L.add(i)); render(); return; }
    case "docancelpending": { const ids=[...S.modal.locs]; S.modal=null; cancelPending(ids); return; }
    case "catclear": S.catSel.clear(); render(); return;
    case "addtab": S.modal.tab=v; render(); if (v==="search") document.getElementById("cq")?.focus(); return;
    case "plselall": { const M=S.modal, P=PLAYLISTS.find(p=>p.id===M.pl), inF=new Set(S.favs.filter(f=>!isRem(f)).map(f=>f.title+"|"+f.artist)); const ids=P.songs().filter(so=>!inF.has(so.title+"|"+so.artist)).map(ensureCat); const all=ids.every(i=>S.catSel.has(i)); ids.forEach(i=>all?S.catSel.delete(i):S.catSel.add(i)); render(); return; }
    case "addmenu": S.addOpen=!S.addOpen; render(); return;
    case "addmore": S.addOpen=false; S.modal={type:"addmore",locs:new Set(),here:free()>0}; render(); return;
    case "doaddmore": { const ids=[...S.catSel], locIds=[...S.modal.locs], here=S.modal.here; S.modal=null; addMore(ids, locIds, here); return; }
    case "unaddo": unaddo(id); render(); toast("Cancelled. The song won't be added at the other locations."); return;
    case "removemore": S.actsOpen=false; S.modal={type:"removemore",locs:new Set(),here:true}; render(); return;
    case "remhere": S.modal.here=!S.modal.here; render(); return;
    case "doremovemore": { const ids=[...S.selected], locIds=[...S.modal.locs], here=S.modal.here; S.modal=null; removeMore(ids, locIds, here); return; }
    case "undodrafts": { const snap=drafts().map(f=>({f,st:f.st})); undoDrafts(); render(); toast(`Undid ${plural(snap.length,"change")}.`, ()=>{ for(const s of snap){ if(s.st==="dAdd") S.favs.push(Object.assign(s.f,{st:"dAdd"})); else s.f.st="dRem"; } }); return; }
    case "review": S.modal={type:"review",locs:new Set(),showLocs:false}; render(); return;
    case "morelocs": S.modal.showLocs=!S.modal.showLocs; render(); return;
    case "loc": { const L=S.modal.locs; L.has(id)?L.delete(id):L.add(id); render(); return; }
    case "send": send(S.modal.showLocs?S.modal.locs.size:0); return;
    case "copy": S.actsOpen=false; S.modal={type:"copy",locs:new Set()}; render(); return;
    case "docopy": { const ids=[...S.selected], locIds=[...S.modal.locs]; S.modal=null; S.selected.clear(); copySongs(ids, locIds); return; }
    case "uncopy": uncopy(id); render(); return;
    case "plopen": S.modal={type:"pl",cat:"Essentials",pl:null,sel:new Set()}; render(); return;
    case "plcat": S.modal.cat=v; render(); return;
    case "plpick": S.modal.pl=id; S.modal.sel=new Set(); render(); return;
    case "plback": S.modal.pl=null; S.modal.sel=new Set(); render(); return;
    case "plsel": { const M=S.modal; M.sel.has(id)?M.sel.delete(id):M.sel.add(id); render(); return; }
    case "plall": case "pltop": {
      const M=S.modal, sg=PLAYLISTS.find(p=>p.id===M.pl).songs(), fr=free();
      const avail=sg.map((so,i)=>String(i)).filter(i=>!inFavs(sg[+i]));
      const lim = act==="pltop" ? +v : fr;
      if (act==="plall" && M.sel.size) M.sel=new Set(); else M.sel=new Set(avail.slice(0, Math.max(0,Math.min(lim, fr))));
      render(); return; }
    case "pladd": { const M=S.modal, P=PLAYLISTS.find(p=>p.id===M.pl), sg=P.songs(); addFromPlaylist([...M.sel].map(i=>sg[+i]), P.name); return; }
    case "close": S.modal=null; render(); return;
    case "stub": toast(`${v} isn't built in this prototype.`); return;
  }
});
document.addEventListener("input", e => { const k=e.target.dataset.input; if (k==="q"||k==="lq"){ S[k]=e.target.value; render(); } else if (k==="cq" && S.modal){ S.modal.q=e.target.value; render(); } });
document.addEventListener("keydown", e => {
  if (S.actsOpen && (e.key==="ArrowDown"||e.key==="ArrowUp")){
    const its=[...document.querySelectorAll(".sb-menu button:not(:disabled)")]; if (its.length){ e.preventDefault(); const i=its.indexOf(document.activeElement); its[(i+(e.key==="ArrowDown"?1:-1)+its.length)%its.length].focus(); } return;
  }
  if (S.modal && e.key==="Tab"){
    const f=[...document.querySelectorAll(".dialog button:not(:disabled), .dialog input:not(:disabled)")]; if (!f.length) return;
    const i=f.indexOf(document.activeElement);
    if (e.shiftKey && i<=0){ e.preventDefault(); f[f.length-1].focus(); } else if (!e.shiftKey && i===f.length-1){ e.preventDefault(); f[0].focus(); }
  }
});
document.addEventListener("keydown", e => { if (e.key==="Escape" && (S.actsOpen||S.addOpen)){ S.actsOpen=false; S.addOpen=false; render(); document.querySelector("[data-act=actsmenu]")?.focus(); return; } if (e.key==="Escape" && S.modal){ S.modal=null; render(); } });


document.body.classList.toggle("test", TEST);
fresh(); if (TEST && TEST_START==="pending") seedPending(); render();
})();
</script>
